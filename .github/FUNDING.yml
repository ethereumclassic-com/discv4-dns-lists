# Renders the Sponsor button on this repository.
#
# `custom` points at the one page that publishes this repository's funding routes, so they are
# checked in a single place rather than copied across files. Add `github: [<account>]` here once
# GitHub Sponsors is enabled for an account that maintains this repository; an entry naming an
# account without Sponsors enabled renders a dead button.
custom: ["https://github.com/ethereumclassic/discv4-dns-lists/blob/main/docs/support.md"]
